# Held-out real recordings (not used while developing the default thresholds).
# They need network access: audio is downloaded from archive.org and ADS-B days are fetched
# into the normal cache on first run (~2 GB per day). Run:
#     sya validate tests/validation/holdout.toml        or        pytest -m holdout
#
# Ground truth comes from the radio aporee sound map metadata (recordist's GPS pin and time).
# Status "no-false-positive": the recording may not be localisable, but if sya claims a
# location it must be within tol_m of the truth.

# Rockaway Park, Queens: elevated subway platform under JFK arrivals, 2023-07-17 17:40:13 EDT.
# ADS-B shows an arrival every 60-100 s at 1-3 km, but the audio carries broadband jet noise and
# ground-reflection fringes, not trackable tones (and trains mask two passes). Public domain.
[[case]]
name = "holdout-ny-rockaway-jfk-arrivals"
audio = "url:https://archive.org/download/aporee_62757_72198/230717174013NYCRockawayPark.flac"
args = ["--at", "2023-07-17T17:40:13", "--tolerance", "10m", "--tz", "America/New_York",
        "--center", "40.6,-73.8", "--radius", "30km"]
tags = ["real", "holdout", "ny"]
[case.expect]
status = "no-false-positive"
lat = 40.583021
lon = -73.827984
tol_m = 1000

# Williamsburg, Brooklyn: street window, helicopter passes with clear rotor-harmonic Doppler
# sweeps, 2023-09-05 ~12:50 EDT. At the true position no ADS-B flight explains the sweeps
# (the helicopters were evidently not broadcasting/received). Public domain.
[[case]]
name = "holdout-ny-brooklyn-helicopter"
audio = "url:https://archive.org/download/aporee_63719_73392/1091XYNEWYORKchopperairfighterstreetatmo230905at1250127.wav"
args = ["--at", "2023-09-05T12:50", "--tolerance", "15m", "--tz", "America/New_York",
        "--center", "40.72,-73.95", "--radius", "30km", "--fmin", "60", "--fmax", "400",
        "--harmonics", "1", "--max-slope", "40", "--min-len", "15"]
tags = ["real", "holdout", "ny"]
[case.expect]
status = "no-false-positive"
lat = 40.71804
lon = -73.956367
tol_m = 1000

# Verde River at Skidmore access point, Arizona, 2023-07-27 ~11:30 MST (round number).
# CC BY-NC-ND 3.0 (lazy_bird) - referenced, not redistributed. Only one jet within 8 km.
[[case]]
name = "holdout-az-verde-river"
audio = "url:https://archive.org/download/aporee_72749_84934/SkidmoreRAPVerdeRiverSummer.mp3"
args = ["--date", "2023-07-27", "--tz", "America/Phoenix", "--state", "AZ"]
tags = ["real", "holdout", "az"]
[case.expect]
status = "no-false-positive"
lat = 34.694168
lon = -111.95549
tol_m = 1000

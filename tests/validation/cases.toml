# ------------------------------------------------- synthetic: ambiguity -> candidate list
[[case]]
name = "synth-phoenix-single-flyover-ambiguous"
audio = "synth:phoenix:6:single"
args = ["--date", "2023-09-28", "--world", "synth:phoenix:6:single", "--timeout", "30"]
tags = ["synthetic", "ambiguous"]
[case.expect]
status = "ambiguous"
lat = 33.4387
lon = -112.04672
tol_m = 1500
within_top = 50

# ------------------------------------------- hybrid: REAL ADS-B (frozen in tests/data), synthetic audio
# Audio is rendered from the real traffic heard at the observer (each flight time-jittered by
# ~1.5 s to mimic ADS-B timing error), then located against the same frozen data.
[[case]]
name = "hybrid-nd-fargo-state-between-local"
audio = "hybrid"
args = ["--state", "ND", "--between", "2023-08-08T07:00", "2023-08-08T09:00", "--tz", "America/Chicago",
        "--cache-dir", "@/../data", "--offline", "--terrain", "tiles:z8", "--timeout", "120"]
tags = ["hybrid", "real-adsb", "state", "between", "nd"]
[case.hybrid]
lat = 46.90821
lon = -96.82014
start = "2023-08-08T13:02:00Z"
[case.expect]
status = "solved"
lat = 46.90821
lon = -96.82014
tol_m = 300
start = "2023-08-08T13:02:00Z"
tol_s = 5

